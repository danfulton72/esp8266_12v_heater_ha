substitutions:
  device_name: henry-water-heater-esp32
  friendly_name: Henry Water Heater ESP32
  # Sensor freshness watchdog: element is forced off if either ADC source has
  # not published for this long (just over three 2.5 s sampling cycles).
  max_sample_age_ms: "8000UL"
  # No-temperature-rise watchdog: if the element accumulates this much ON time
  # without the tank rising by at least min_temp_rise_c, latch HEATING FAULT
  # (sensor out of its pocket, ADC mux fault, failed element...).  Cleared by
  # switching the Element Switch off and on again, or by a reboot.
  # Check a normal heat-up in Home Assistant history and tighten if you like:
  # the timeout should comfortably exceed the time your element takes to
  # raise a full tank by min_temp_rise_c.
  no_rise_timeout_ms: "1800000UL"   # 30 minutes of element ON time
  min_temp_rise_c: "1.0f"
  # A0 voltage that the ESP8266 D1 Mini reported as 1023 (its on-board
  # 220k/100k divider gave ~3.2 V full scale).  Keeps the original maths valid.
  a0_full_scale: "3.2f"
  # ESP32 -> ESP8266 A0 calibration.  The thermistor and battery signals come
  # from different circuits on the heater board, so the ESP32 (which, unlike
  # the ESP8266 D1 Mini, has no 220k/100k divider loading A0) sees a different
  # error on each, and each gets its own correction.
  #
  # Temperature: least-squares straight line through four ESP32/ESP8266
  # comparisons on the same tank (2026-11-18):
  #   equivalent_volts = temp_cal_gain*V + temp_cal_offset
  #   ESP32 2.216 V vs ESP8266 1.995 V  ( 3.2 C)
  #   ESP32 1.456 V vs ESP8266 1.226 V  (27.4 C)
  #   ESP32 1.137 V vs ESP8266 0.873 V  (40.0 C; ESP8266 had just hit target)
  #   ESP32 0.771 V vs ESP8266 0.553 V  (54.3 C; ESP32 had just hit target)
  # The ESP32 reads a near-constant ~0.23 V higher on A0.  The 40 C and 54 C
  # pairs were skewed in opposite directions by the sensor cooling just after
  # the element switched off, so a straight line averages them out.
  temp_cal_gain: "1.00785f"
  temp_cal_offset: "-0.24409f"
  # Battery: simple gain, from two consistent comparisons
  # (ESP32 12.95 V vs ESP8266 13.24 V, and 12.93 V vs 13.21 V).
  # To refine with a multimeter:
  #   new value = current value * (meter volts / displayed volts)
  battery_cal_gain: "1.023f"
  # Plausibility limits.  A floating or shorted A0 signal reads near 0 V, which
  # the original conversion turns into a valid-looking ~85-105 C.  Anything
  # above max_valid_temp_c is therefore treated as a sensor fault.
  max_valid_temp_c: "80.0"
  # A battery reading below this means the A0 signal path is missing (board not
  # fitted, carrier fault or a floating input), not a real battery voltage.
  min_signal_voltage: "8.0f"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "ESPHome replacement reconstructed from Bobil V1.2 ESP8266 firmware (ESP32 D1 Mini port + BT proxy)"
  on_boot:
    - priority: -100.0
      then:
        # Belt-and-braces safety: the GPIO switch also uses ALWAYS_OFF.
        - switch.turn_off: heater_gpio
        - script.execute: sample_inputs
        # Branded startup splash, then fall through to the normal status page.
        - display.page.show: page_splash
        - component.update: oled
        - delay: 2s
        - display.page.show: page_status
        - component.update: oled
        - script.execute: screen_timeout

# ESP32 D1 Mini (ESP32-WROOM-32, CH9102, "MH-ET LIVE MiniKit" layout).
# Only the OUTER pin rows are used; they match the ESP8266 D1 Mini footprint:
#   D1=GPIO22 (SCL)  D2=GPIO21 (SDA)  D3=GPIO17  D4=GPIO16
#   D6=GPIO19        D7=GPIO23        A0=GPIO36 (SVP)
# ESP-IDF is the recommended framework for bluetooth_proxy.
# Preferences (restored numbers/switches) live in NVS flash on ESP32, so the
# ESP8266-only restore_from_flash / early_pin_init options are no longer needed.
esp32:
  board: wemos_d1_mini32
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true
      
# Bluetooth proxy for Home Assistant.
esp32_ble_tracker:
  scan_parameters:
    active: true
    
external_components:
  - source:
      type: git
      url: https://github.com/davidcoulson/esphome-ble-advert-filter
      ref: v2.0.4
    components: [ble_advert_filter]
    
bluetooth_proxy:
  active: true

ble_advert_filter:
  mac_allowlist:
    - "4C:E1:74:68:A3:A8" # RTMShunt30032000674
    - "CC:45:A5:AB:A6:2F" # RBC50D1S
    - "CC:45:A5:8A:7B:70" # RIV1230PCH
    - "E4:66:E5:F9:B2:76" # Sunster
    - "D0:0C:5E:F9:EB:00" # Awning Sunster
    - "F3:A9:C4:86:04:3C" # WaterFlowMeter
    - "FA:EE:AE:BA:A0:F2" # Mopeka
    - "ED:67:39:CD:8B:23" # AMPSFridge

logger:
  level: WARN

api:

ota:
  - platform: esphome
  - platform: web_server    
    
wifi:
  ssid: !secret henryvan_wifi_ssid
  password: !secret wifi_password
  # WiFi/Bluetooth coexistence on the ESP32 needs modem sleep, so NONE is not
  # allowed once Bluetooth is enabled.  LIGHT is the ESP32 default.
  power_save_mode: LIGHT
  ap:
    ssid: "Bobil Controller Fallback"
    password: "12345678"

captive_portal:

# Enable Web server.
web_server:
  port: 80
  
# Same physical D2 (SDA) / D1 (SCL) header pins as the ESP8266 D1 Mini.
# On the ESP32 D1 Mini those are GPIO21=D2 (SDA) and GPIO22=D1 (SCL).
i2c:
  sda: GPIO21
  scl: GPIO22
  frequency: 100kHz
  scan: true

font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 11
  - file: "gfonts://Roboto@700"
    id: font_large
    size: 20

image:
  - platform: file
    file: "henry_gerbil.png"
    id: splash_logo
    type: BINARY

# Non-persistent controller state.  Stage values:
# 0=ready/off, 1=300 s qualification, 2=280-300 s verification load,
# 3=heating, 4=temp sensor error, 5=low voltage, 6=config error,
# 7=target reached, 8=no A0 signal (battery reading implausibly low),
# 9=sensor data stale (or STARTING before the first samples),
# 10=heating fault (no temperature rise; latched).
globals:
  - id: qualify_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: qualify_started_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: controller_stage
    type: int
    restore_value: no
    initial_value: '0'
  # Tracks whether the OLED panel is currently awake. This is runtime-only.
  - id: display_awake
    type: bool
    restore_value: no
    initial_value: 'true'
  # Sensor freshness watchdog: runtime-only timestamps and startup flags.
  - id: last_temp_update_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: last_battery_update_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: temp_sample_seen
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: battery_sample_seen
    type: bool
    restore_value: no
    initial_value: 'false'
  # No-temperature-rise watchdog: runtime-only.
  - id: rise_baseline_temp
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: rise_on_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: rise_last_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: heating_fault
    type: bool
    restore_value: no
    initial_value: 'false'

switch:
# enable a reboot button
  - platform: restart
    name: "Restart"
  
  # D6 (GPIO19 on ESP32 D1 Mini) selects which analogue source is connected
  # to A0.  LOW = thermistor; HIGH = battery-voltage divider.
  - platform: gpio
    id: adc_mux
    pin: GPIO19
    internal: true
    restore_mode: ALWAYS_OFF

  # D7 (GPIO23 on ESP32 D1 Mini) is the physical heater command.  The original
  # firmware is ACTIVE HIGH.  Never expose this switch directly to Home Assistant.
  - platform: gpio
    id: heater_gpio
    pin: GPIO23
    internal: true
    restore_mode: ALWAYS_OFF

  # Equivalent to CURRENT ELEMENT / element enable in the original UI.
  # Deliberately never restored ON after a reboot.
  - platform: template
    id: element_enable
    name: "Element Switch"
    optimistic: true
    restore_mode: ALWAYS_OFF
    icon: mdi:radiator

  # Flash backup contains mode=1, which decompilation proves means
  # UNCONTROLLED VOLTAGE.  The state is restored, but Element Routine above
  # still always boots OFF so a reboot cannot energise the heater by itself.
  - platform: template
    id: uncontrolled_voltage
    name: "Uncontrolled Voltage"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    icon: mdi:battery-alert-variant-outline

number:
  - platform: template
    id: target_temperature
    name: "Tank Temperature Target"
    unit_of_measurement: "°C"
    device_class: temperature
    optimistic: true
    restore_value: true
    initial_value: 40
    min_value: 20
    max_value: 75
    step: 5
    mode: box

  - platform: template
    id: element_on_voltage
    name: "Element On Voltage"
    unit_of_measurement: "V"
    device_class: voltage
    optimistic: true
    restore_value: true
    initial_value: 13.4
    min_value: 12.0
    max_value: 15.0
    step: 0.2
    mode: box

  - platform: template
    id: element_off_voltage
    name: "Element Off Voltage"
    unit_of_measurement: "V"
    device_class: voltage
    optimistic: true
    restore_value: true
    initial_value: 12.2
    min_value: 12.0
    max_value: 15.0
    step: 0.2
    mode: box

sensor:
  # Raw A0 (GPIO36/SVP) reading in volts.  Never polled on its own: the
  # sample_inputs script calls sample() directly at the right point in the
  # mux cycle, as the original analogRead(A0) did.
  #
  # NOTE: unlike the ESP8266 D1 Mini, the ESP32 D1 Mini has no 220k/100k
  # divider on A0, and at 12 dB attenuation the ESP32 ADC tops out around
  # 3.1 V (and is least accurate above ~2.5 V).  Check the readings against a
  # multimeter after fitting and tune the a0_* substitutions if needed.
  - platform: adc
    id: a0_volts
    pin: GPIO36
    attenuation: 12db
    update_interval: never
    internal: true

  # Values are published by sample_inputs.  A normal ESPHome ADC sensor cannot
  # represent this hardware because the original design multiplexes A0.
  - platform: template
    id: tank_temperature
    name: "Tank Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never
    on_raw_value:
      then:
        - lambda: |-
            id(last_temp_update_ms) = millis();
            id(temp_sample_seen) = true;

  - platform: template
    id: battery_voltage
    name: "Battery Voltage"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    update_interval: never
    on_raw_value:
      then:
        - lambda: |-
            id(last_battery_update_ms) = millis();
            id(battery_sample_seen) = true;

  - platform: template
    id: temp_adc_raw
    name: "Temperature ADC Raw"
    accuracy_decimals: 0
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: never

  - platform: template
    id: battery_adc_raw
    name: "Battery ADC Raw Average"
    accuracy_decimals: 1
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: never

  - platform: template
    id: qualification_countdown
    name: "Element On Countdown"
    unit_of_measurement: "s"
    icon: mdi:timer-outline
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      if (!id(qualify_active))
        return 0.0f;
      const uint32_t elapsed = millis() - id(qualify_started_ms);
      if (elapsed >= 300000UL)
        return 0.0f;
      return ceilf((300000.0f - elapsed) / 1000.0f);

binary_sensor:
  - platform: template
    id: heating_element
    name: "Heating Element"
    icon: mdi:heat-wave
    lambda: |-
      return id(heater_gpio).state;

  # Original menu/screen button: D4 (GPIO16 on ESP32 D1 Mini), INPUT_PULLUP,
  # active LOW.  No longer a boot-strapping pin, so presses at power-up are safe.
  - platform: gpio
    id: menu_button
    name: "Menu Button"
    internal: true
    pin:
      number: GPIO16
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_press:
      # If the OLED has timed out, the first press only wakes it.
      - if:
          condition:
            lambda: 'return !id(display_awake);'
          then:
            - script.execute: wake_screen
          else:
            - display.page.show_next: oled
            - component.update: oled
            - script.execute: screen_timeout

  # Original select/adjust button: D3 (GPIO17 on ESP32 D1 Mini), INPUT_PULLUP,
  # active LOW.
  - platform: gpio
    id: action_button
    name: "Action Button"
    internal: true
    pin:
      number: GPIO17
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_press:
      # If the OLED has timed out, the first press only wakes it and does not
      # toggle the heater or alter any setting.
      - if:
          condition:
            lambda: 'return !id(display_awake);'
          then:
            - script.execute: wake_screen
          else:
            # Status page: toggle the same logical element-enable routine used by
            # the original CURRENT ELEMENT screen.
            - if:
                condition:
                  display.is_displaying_page: page_status
                then:
                  - switch.toggle: element_enable
            - if:
                condition:
                  display.is_displaying_page: page_target
                then:
                  - number.set:
                      id: target_temperature
                      value: !lambda |-
                        float v = id(target_temperature).state + 5.0f;
                        return v > 75.0f ? 20.0f : v;
            - if:
                condition:
                  display.is_displaying_page: page_on_voltage
                then:
                  - number.set:
                      id: element_on_voltage
                      value: !lambda |-
                        float v = id(element_on_voltage).state + 0.2f;
                        return v > 15.01f ? 12.0f : v;
            - if:
                condition:
                  display.is_displaying_page: page_off_voltage
                then:
                  - number.set:
                      id: element_off_voltage
                      value: !lambda |-
                        float v = id(element_off_voltage).state + 0.2f;
                        return v > 15.01f ? 12.0f : v;
            - if:
                condition:
                  display.is_displaying_page: page_voltage_mode
                then:
                  - switch.toggle: uncontrolled_voltage
            - component.update: oled
            - script.execute: screen_timeout

text_sensor:
  # Expose ESPHome version as sensor.
  - platform: version
    name: ESPHome Version

  # Expose WiFi information as sensors.
  - platform: wifi_info
    ip_address:
      name: IP
    ssid:
      name: SSID
    bssid:
      name: BSSID  

  - platform: template
    name: "Public IP"
    id: public_ip
    
  - platform: template
    id: controller_status
    name: "Controller Status"
    icon: mdi:state-machine
    update_interval: 500ms
    lambda: |-
      if (!id(element_enable).state)
        return {"ELEMENT OFF"};
      switch (id(controller_stage)) {
        case 1: return {"ON IN"};
        case 2: return {"VERIFY"};
        case 3: return {"HEATING"};
        case 4: return {"SENSOR ERROR"};
        case 5: return {"LOW VOLTAGE"};
        case 6: return {"CONFIG ERROR"};
        case 7: return {"TARGET REACHED"};
        case 8: return {"NO SIGNAL"};
        case 9:
          // Before the first samples arrive this is normal start-up.
          if (!id(temp_sample_seen) || !id(battery_sample_seen))
            return {"STARTING"};
          return {"SENSOR STALE"};
        case 10: return {"HEATING FAULT"};
        default:
          if (id(uncontrolled_voltage).state)
            return {"READY / UNCONTROLLED"};
          return {"READY"};
      }

script:
  # Wake the OLED with a short splash. The button press that calls this script
  # is intentionally consumed, so it cannot toggle the heater or alter a setting.
  - id: wake_screen
    mode: restart
    then:
      - lambda: |-
          id(oled).turn_on();
          id(display_awake) = true;
      - display.page.show: page_splash
      - component.update: oled
      - delay: 1s
      - display.page.show: page_status
      - component.update: oled
      - script.execute: screen_timeout

  # Sliding OLED inactivity timeout. Every physical button press restarts this
  # script; after 60 seconds the SH1106 panel is switched off while the heater
  # controller continues to run normally.
  - id: screen_timeout
    mode: restart
    then:
      - delay: 60s
      - lambda: |-
          id(oled).turn_off();
          id(display_awake) = false;

  # Recreates the V1.2 ADC timing/state machine:
  #   +100 ms  D6 LOW
  #   +700 ms  temperature conversion
  #   +1200 ms D6 HIGH
  #   +1800 ms battery conversion (100 samples)
  #   +2500 ms cycle restarts
  - id: sample_inputs
    mode: restart
    then:
      - delay: 100ms
      - switch.turn_off: adc_mux
      - delay: 600ms
      - lambda: |-
          // Convert ESP32 volts back to the ESP8266 D1 Mini's 10-bit A0 scale
          // so the original V1.2 maths below stays byte-for-byte equivalent.
          // Average 32 readings: the ESP32 ADC is noisier than the ESP8266's.
          float sum_t = 0.0f;
          for (int i = 0; i < 32; i++)
            sum_t += id(a0_volts).sample();
          const float v32 = sum_t / 32.0f;
          const float a0_v = ${temp_cal_gain} * v32 + ${temp_cal_offset};
          const int raw = (int) lroundf(a0_v * 1023.0f / ${a0_full_scale});
          id(temp_adc_raw).publish_state((float) raw);

          // Exact V1.2 conversion recovered from Xtensa code.
          // The unusual -275.15 (rather than -273.15) is intentional: it is
          // present in the original firmware and is retained for equivalence.
          const double v = ((double) raw * (5.0 / 1023.0)) + 0.37;
          // Explicit open-circuit check: the ESP32 ADC saturates around
          // 3.0-3.1 V, which after calibration could land just inside the
          // valid range.  Anything above 2.8 V (about -17 C) is a fault.
          if (v32 > 2.8f || !(v > 0.0 && v < 5.0)) {
            id(tank_temperature).publish_state(NAN);
          } else {
            const double r_ntc = 10000.0 * v / (5.0 - v);
            const double inv_t = (1.0 / 298.15) +
                                 (log(r_ntc / 10000.0) / 3500.0);
            const double temp_c = (1.0 / inv_t) - 275.15;
            // Upper limit tightened from the original 125 C: readings above
            // max_valid_temp_c come from a shorted/floating signal, not water.
            if (!std::isfinite(temp_c) || temp_c < -50.0 ||
                temp_c > ${max_valid_temp_c})
              id(tank_temperature).publish_state(NAN);
            else
              id(tank_temperature).publish_state((float) temp_c);
          }
      - delay: 500ms
      - switch.turn_on: adc_mux
      - delay: 600ms
      - lambda: |-
          float sum_v = 0.0f;
          for (int i = 0; i < 100; i++)
            sum_v += id(a0_volts).sample();

          // Average, then express on the ESP8266 10-bit A0 scale.
          const float avg_v = (sum_v / 100.0f) * ${battery_cal_gain};
          const float avg = avg_v * 1023.0f / ${a0_full_scale};
          id(battery_adc_raw).publish_state(avg);

          // Exact V1.2 scaling: ADC * (5/1023) * 3.44.
          const float volts = avg * (5.0f / 1023.0f) * 3.44f;
          id(battery_voltage).publish_state(volts);

# Fast control loop plus the original 2.5 s ADC cycle.
interval:
  - interval: 250ms
    then:
      - lambda: |-
          const bool enabled = id(element_enable).state;
          const bool uncontrolled = id(uncontrolled_voltage).state;
          const float temp = id(tank_temperature).state;
          const float volts = id(battery_voltage).state;
          const float target = id(target_temperature).state;
          const float on_v = id(element_on_voltage).state;
          const float off_v = id(element_off_voltage).state;

          auto stop_and_reset = [&](int stage) {
            id(heater_gpio).turn_off();
            id(qualify_active) = false;
            id(qualify_started_ms) = 0;
            id(controller_stage) = stage;
          };

          // Element routine is the master enable.  This deliberately wins over
          // every other state, just as the original physical UI intended.
          if (!enabled) {
            // Switching the element off also clears a latched heating fault.
            id(heating_fault) = false;
            id(rise_baseline_temp) = NAN;
            id(rise_on_ms) = 0;
            id(rise_last_ms) = 0;
            stop_and_reset(0);
            return;
          }

          // Latched no-temperature-rise fault: stay off until the element is
          // switched off and on again (or the device reboots).
          if (id(heating_fault)) {
            stop_and_reset(10);
            return;
          }

          // Fail safe if either ADC source stops publishing samples.
          // Allow slightly more than three nominal 2.5 s sampling cycles.
          const uint32_t now = millis();
          const uint32_t max_sample_age_ms = ${max_sample_age_ms};

          const bool temp_stale =
              !id(temp_sample_seen) ||
              (uint32_t)(now - id(last_temp_update_ms)) > max_sample_age_ms;
          const bool battery_stale =
              !id(battery_sample_seen) ||
              (uint32_t)(now - id(last_battery_update_ms)) > max_sample_age_ms;

          if (temp_stale || battery_stale) {
            stop_and_reset(9);
            return;
          }

          // No plausible A0 signal at all => never heat.  Checked before the
          // uncontrolled-voltage bypass so it applies in both modes.
          if (!std::isfinite(volts) || volts < ${min_signal_voltage}) {
            stop_and_reset(8);
            return;
          }

          // No trustworthy tank sensor => never heat.
          if (!std::isfinite(temp)) {
            stop_and_reset(4);
            return;
          }

          // No-temperature-rise watchdog.  Accumulates element ON time and
          // requires the tank to rise by min_temp_rise_c within
          // no_rise_timeout_ms of it.  ON time adds up across heating periods
          // until a rise is seen, so on/off cycling cannot hide a fault.  The
          // baseline follows the water down while it cools, so a cool-down
          // between periods does not count against the next one.  Every earlier
          // early-return switches the element off, so time skipped by them is
          // never counted as ON time.
          {
            const uint32_t dt = id(rise_last_ms) == 0
                                    ? 0
                                    : (uint32_t)(now - id(rise_last_ms));
            id(rise_last_ms) = now;
            if (!std::isfinite(id(rise_baseline_temp)) ||
                temp < id(rise_baseline_temp))
              id(rise_baseline_temp) = temp;
            if (temp >= id(rise_baseline_temp) + ${min_temp_rise_c}) {
              id(rise_baseline_temp) = temp;
              id(rise_on_ms) = 0;
            } else if (id(heater_gpio).state) {
              id(rise_on_ms) += dt;
            }
            if (id(rise_on_ms) > ${no_rise_timeout_ms}) {
              id(heating_fault) = true;
              stop_and_reset(10);
              return;
            }
          }

          // Upper edge of the original 5 C thermal hysteresis.
          if (temp >= target) {
            stop_and_reset(7);
            return;
          }

          if (uncontrolled) {
            // Firmware mode=1: bypass battery voltage gating/countdown, but
            // retain the tank-temperature cutoff/hysteresis.
            id(qualify_active) = false;
            id(qualify_started_ms) = 0;

            if (temp <= (target - 5.0f)) {
              id(heater_gpio).turn_on();
              id(controller_stage) = 3;
            } else {
              // In the 5 C hysteresis band retain the existing heater state.
              id(controller_stage) = id(heater_gpio).state ? 3 : 0;
            }
            return;
          }

          // Controlled-voltage mode.  Reject an impossible threshold pair
          // rather than allowing it to produce unsafe behaviour.
          if (!(on_v > off_v)) {
            stop_and_reset(6);
            return;
          }

          if (!std::isfinite(volts)) {
            stop_and_reset(5);
            return;
          }

          // Lower threshold is the hard dropout/reset threshold.
          if (volts <= off_v) {
            stop_and_reset(5);
            return;
          }

          // Once the 300 s qualification has completed, hysteresis is governed
          // by OFF voltage and target temperature; ON voltage is only needed
          // to begin a new qualification.
          if (id(controller_stage) == 3 && id(heater_gpio).state) {
            return;
          }

          if (id(qualify_active)) {
            const uint32_t elapsed = millis() - id(qualify_started_ms);

            // V1.2 has a 20 s load-verification phase: D7 (heater) goes HIGH at
            // 280 s, while the user-visible 300 s countdown continues.
            if (elapsed >= 300000UL) {
              id(heater_gpio).turn_on();
              id(controller_stage) = 3;
              id(qualify_active) = false;
            } else if (elapsed >= 280000UL) {
              id(heater_gpio).turn_on();
              id(controller_stage) = 2;
            } else {
              id(heater_gpio).turn_off();
              id(controller_stage) = 1;
            }
            return;
          }

          // Lower edge of the original 5 C thermal hysteresis plus the ON
          // voltage threshold starts a new 300 s qualification.
          if (temp <= (target - 5.0f) && volts >= on_v) {
            id(qualify_active) = true;
            id(qualify_started_ms) = millis();
            id(heater_gpio).turn_off();
            id(controller_stage) = 1;
          } else {
            id(heater_gpio).turn_off();
            id(controller_stage) = 0;
          }

  - interval: 2.5s
    then:
      - script.execute: sample_inputs

# The original firmware init sequence identifies this as a 128x64 SH1106 I2C display at 0x3C.
display:
  - platform: ssd1306_i2c
    id: oled
    model: "SH1106 128x64"
    address: 0x3C
    update_interval: 500ms
    pages:
      - id: page_splash
        lambda: |-
          it.image(3, 3, id(splash_logo));

      - id: page_status
        lambda: |-
          it.print(0, 0, id(font_small), "CURRENT ELEMENT");
          it.printf(0, 14, id(font_large), "%s",
                    id(heater_gpio).state ? "ON" : "OFF");
          // Staleness is worked out here as well as in the control loop so the
          // display flags it even while the element is switched off.
          const uint32_t now = millis();
          const bool starting =
              !id(temp_sample_seen) || !id(battery_sample_seen);
          const bool stale =
              !starting &&
              ((uint32_t)(now - id(last_temp_update_ms)) > ${max_sample_age_ms} ||
               (uint32_t)(now - id(last_battery_update_ms)) > ${max_sample_age_ms});
          if (id(heating_fault))
            it.print(0, 38, id(font_small), "HEATING FAULT");
          else if (starting)
            it.print(0, 38, id(font_small), "STARTING...");
          else if (stale)
            it.print(0, 38, id(font_small), "SENSOR STALE");
          else if (std::isfinite(id(tank_temperature).state))
            it.printf(0, 38, id(font_small), "TEMP %.1fC", id(tank_temperature).state);
          else
            it.print(0, 38, id(font_small), "TEMP SENSOR ERROR");
          if (!std::isfinite(id(battery_voltage).state) ||
              id(battery_voltage).state < ${min_signal_voltage})
            it.print(0, 51, id(font_small), "V NO SIGNAL");
          else
            it.printf(0, 51, id(font_small), "V %.2f  %s",
                      id(battery_voltage).state,
                      id(uncontrolled_voltage).state ? "UNCTRL" : "CTRL");

      - id: page_target
        lambda: |-
          it.print(0, 0, id(font_small), "TANK TEMP TARGET");
          it.printf(0, 20, id(font_large), "%.0f C", id(target_temperature).state);
          it.print(0, 51, id(font_small), "ACTION = +5 C");

      - id: page_on_voltage
        lambda: |-
          it.print(0, 0, id(font_small), "ELEMENT ON VOLTAGE");
          it.printf(0, 20, id(font_large), "%.1f V", id(element_on_voltage).state);
          it.print(0, 51, id(font_small), "ACTION = +0.2 V");

      - id: page_off_voltage
        lambda: |-
          it.print(0, 0, id(font_small), "ELEMENT OFF VOLTAGE");
          it.printf(0, 20, id(font_large), "%.1f V", id(element_off_voltage).state);
          it.print(0, 51, id(font_small), "ACTION = +0.2 V");

      - id: page_voltage_mode
        lambda: |-
          it.print(0, 0, id(font_small), "VOLTAGE MODE");
          it.printf(0, 20, id(font_large), "%s",
                    id(uncontrolled_voltage).state ? "UNCONTROLLED" : "CONTROLLED");
          it.print(0, 51, id(font_small), "ACTION = TOGGLE");
